function parseCityRow(r){
 const name=r.nume||r.name||r.oras||r.city||''; const code=String(r.judetAuto||r.countyCode||r.county||'').toUpperCase();

 return name?{name,county:cityKey(name)==='bucuresti'?'București':county}:null;
}

function schedulePhoneCheck(){phoneDuplicate=false;clearTimeout(phoneCheckTimer);const el=document.getElementById('field'),msg=document.getElementById('err');if(!el||!msg)return;const d=normalizePhoneClient(el.value);if(!/^07\d{8}$/.test(d)){msg.textContent='';return}msg.textContent='Verificăm numărul…';const seq=++phoneCheckSeq;phoneCheckTimer=setTimeout(()=>checkPhoneAvailability(d,seq),260)}

  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',playBg,{once:true});
  } else playBg();

  window.addEventListener('load',playBg,{once:true});
